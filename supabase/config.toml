project_id = "service-center"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "servicecenter://auth-callback", "exp://127.0.0.1:8081"]
# W7-JRN-D3: 15 minutes bounds what a signed-out token can still read where the
# session check cannot run (Realtime). Hosted projects: set the same value in
# Dashboard > Authentication > Sessions (JWT expiry). See docs/adr/0005-*.md.
jwt_expiry = 900
enable_refresh_token_rotation = true
enable_signup = true
# SEC-005: the server enforces the same 8-character minimum the forms do.
# Hosted projects: Dashboard > Authentication > Providers > Email.
minimum_password_length = 8

# Super admins must sign in with two-factor (TOTP); see docs/plans/super-admin-dashboard.md.
# The hosted project needs the same setting (Authentication -> Multi-Factor).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enabled = true
# SEC-005: a new signup must prove it owns its inbox before it counts as a
# confirmed email (invitation linking, join requests and super-admin
# invitations all trust a confirmed email). Local confirmation emails land in
# Inbucket (http://localhost:54324). Hosted projects: Dashboard >
# Authentication > Providers > Email > "Confirm email" must be on.
enable_confirmations = true
double_confirm_changes = true
